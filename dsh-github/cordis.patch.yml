# dsh-github bundle.
#
# Two rows are inserted:
#
#   github-mcp  the shipped MCP client bridge (@deepseek-ai/dsh-mcp-client).
#               This is the row the Settings page configures: the page writes a
#               complete raw config into THIS profile patch through the Host
#               `configEditor` service, which is why the row exists here even
#               before a token is saved. `disabled: true` keeps the install
#               silent — no outbound connection is attempted until the user
#               stores a token and presses 连接, at which point the Host enables
#               the row and then rewrites its config.
#
#   github      the Host half of this bundle: the /api/github.* routes behind
#               the Settings page and the /github human command.
#
# The Host row names its file by ABSOLUTE PATH on purpose: the Loader memoizes
# an imported host module per specifier, so an absolute path is what makes an
# edit to lib/host.js take effect on the next loader reload without restarting
# the application. For a normally installed copy (published package or plain
# node_modules) replace the row with the portable form:
#
#   - insert:
#       - id: github
#         name: dsh-github
#
# Config keys for the `github` row are all optional:
#   serverName      MCP namespace, default "github"
#   mcpRowId        patch id of the MCP client row, default "github-mcp"
#   workspaceRoot   default parent directory for clones, default <workspace>/github-repos
#   gitBinary       git executable, default resolved through ctx.subprocess
#   debugDumpPath   write the process's authenticated loopback URL plus one
#                   status snapshot to that file (local diagnosis only)

- insert:
    - id: github-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        failOnStartupError: false

    - id: github
      name: D:/Backup/Documents/deepseek-harness/default-workspace/dsh-github/lib/host.js
